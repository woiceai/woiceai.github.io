title: WoiceAI 2.0
description: Architecture, deployment, models and operations for WoiceAI
url: "https://woiceai.github.io"
baseurl: ""
theme: jekyll-theme-cayman
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
include:
  - README.md
exclude:
  - Gemfile
  - Gemfile.lock
  - scripts
  - VALIDATION.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
