<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="page-header" role="banner">
    <h1 class="project-name">{{ site.title | escape }}</h1>
    <p class="project-tagline">{{ site.description | escape }}</p>
    <a class="btn" href="{{ '/' | relative_url }}">Documentation home</a>
  </header>
  <main class="main-content" id="content">{{ content }}</main>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    document.querySelectorAll('code.language-mermaid').forEach(code => {
      const container = document.createElement('div');
      container.className = 'mermaid';
      container.textContent = code.textContent;
      code.parentElement.replaceWith(container);
    });
    mermaid.initialize({ startOnLoad: true, securityLevel: 'strict' });
  </script>
</body>
</html>
